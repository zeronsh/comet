[workspace]

[package]
name = "comet-web-lifecycle-tests"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[dependencies]
zeron-rpc = { path = "../../../../crates/rpc", default-features = false, features = ["client"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "WebSocket", "BinaryType", "MessageEvent", "Event", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "AbortController", "AbortSignal"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = "0.1"
zeron-proto = { path = "../../../../crates/proto" }
serde = "1"
serde_json = "1"

[profile.dev]
debug = 0
