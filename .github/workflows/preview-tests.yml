name: Preview networking
on:
  pull_request:
    paths: ['crates/preview/**', 'crates/proto/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/preview-tests.yml']
  push:
    branches: [main]
    paths: ['crates/preview/**', 'crates/proto/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/preview-tests.yml']
permissions:
  contents: read
concurrency:
  group: preview-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  networking:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p zeron-preview
