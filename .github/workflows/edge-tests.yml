name: Edge tests

# Main pushes are tested by deploy.yml before deployment.
on:
  pull_request:
    paths:
      - 'edge/**'
      - '.github/workflows/edge-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
