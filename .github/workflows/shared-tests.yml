name: Shared regressions

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/engine/**'
      - 'crates/harness/**'
      - 'crates/update/**'
      - 'crates/proto/**'
      - 'crates/preview/**'
      - 'crates/doc/**'
      - 'crates/sync/**'
      - 'crates/rpc/**'
      - '.github/workflows/shared-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/engine/**'
      - 'crates/harness/**'
      - 'crates/update/**'
      - 'crates/proto/**'
      - 'crates/preview/**'
      - 'crates/doc/**'
      - 'crates/sync/**'
      - 'crates/rpc/**'
      - '.github/workflows/shared-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-regressions:
    name: Shared regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Shared agent, terminal, ownership, and updater regressions
        run: cargo test --locked -p zeron-harness -p zeron-engine -p zeron-update --lib
