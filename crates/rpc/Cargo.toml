[package]
name = "zeron-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["native"]
# The same typed client/reducer runs on native and browser executors.
# Wire-only users still need neither a runtime nor networking dependencies.
client = ["dep:tokio", "dep:futures", "dep:tracing", "dep:wasm-bindgen-futures"]
native = ["client", "tokio/full", "dep:zeron-proto", "dep:zeron-sync", "dep:tokio-tungstenite", "dep:anyhow", "dep:async-trait", "dep:uuid"]

[dependencies]
zeron-proto = { workspace = true, optional = true }
zeron-sync = { workspace = true, optional = true }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
anyhow = { workspace = true, optional = true }
thiserror.workspace = true
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }


[dev-dependencies]
zeron-doc.workspace = true
