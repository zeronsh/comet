[package]
name = "zeron-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["highlighting"]
highlighting = [
    "dep:tree-sitter", "dep:tree-sitter-highlight", "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript", "dep:tree-sitter-typescript", "dep:tree-sitter-python",
    "dep:tree-sitter-go", "dep:tree-sitter-json", "dep:tree-sitter-bash",
    "dep:tree-sitter-toml-ng", "dep:tree-sitter-md", "dep:tree-sitter-html",
    "dep:tree-sitter-css", "dep:tree-sitter-yaml", "dep:tree-sitter-c",
    "dep:tree-sitter-cpp", "dep:tree-sitter-c-sharp", "dep:tree-sitter-java",
    "dep:tree-sitter-kotlin-ng", "dep:tree-sitter-swift", "dep:tree-sitter-ruby",
    "dep:tree-sitter-php", "dep:tree-sitter-sequel", "dep:tree-sitter-lua",
    "dep:tree-sitter-nix", "dep:tree-sitter-make", "dep:tree-sitter-containerfile",
]

[dependencies]
thiserror.workspace = true
tree-sitter = { version = "=0.26.11", optional = true }
tree-sitter-highlight = { version = "=0.26.11", optional = true }
tree-sitter-rust = { version = "=0.24.2", optional = true }
tree-sitter-javascript = { version = "=0.25.0", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-go = { version = "=0.25.0", optional = true }
tree-sitter-json = { version = "=0.24.8", optional = true }
tree-sitter-bash = { version = "=0.25.1", optional = true }
tree-sitter-toml-ng = { version = "=0.7.0", optional = true }
tree-sitter-md = { version = "=0.5.3", optional = true }
tree-sitter-html = { version = "=0.23.2", optional = true }
tree-sitter-css = { version = "=0.25.0", optional = true }
tree-sitter-yaml = { version = "=0.7.2", optional = true }
tree-sitter-c = { version = "=0.24.2", optional = true }
tree-sitter-cpp = { version = "=0.23.4", optional = true }
tree-sitter-c-sharp = { version = "=0.23.5", optional = true }
tree-sitter-java = { version = "=0.23.5", optional = true }
tree-sitter-kotlin-ng = { version = "=1.1.0", optional = true }
tree-sitter-swift = { version = "=0.7.3", optional = true }
tree-sitter-ruby = { version = "=0.23.1", optional = true }
tree-sitter-php = { version = "=0.24.2", optional = true }
tree-sitter-sequel = { version = "=0.3.11", optional = true }
tree-sitter-lua = { version = "=0.5.0", optional = true }
tree-sitter-nix = { version = "=0.3.0", optional = true }
tree-sitter-make = { version = "=1.1.1", optional = true }
tree-sitter-containerfile = { version = "=0.9.2", optional = true }
