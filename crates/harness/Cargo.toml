[package]
name = "zeron-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Synthetic native protocol peer for subprocess tests; never part of a normal build.
native-fixture = []

[[bin]]
name = "harness-native-fixture"
path = "tests/fixtures/native_agent.rs"
required-features = ["native-fixture"]

[dependencies]
zeron-proto.workspace = true
base64 = "0.22"
reqwest.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io-util"] }
uuid.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
