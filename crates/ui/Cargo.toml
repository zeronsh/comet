[package]
name = "zeron-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
browser-fixture = []
resource-profile = ["gpui/bench", "gpui_platform/test-support"]

[[example]]
name = "macos-resource-profile"
required-features = ["resource-profile"]

[[example]]
name = "preview-fixture"
required-features = ["browser-fixture"]

[[example]]
name = "browser-fixture"
required-features = ["browser-fixture"]

[dependencies]
url = "2"
zeron-proto.workspace = true
similar.workspace = true
zeron-doc.workspace = true
zeron-rpc = { path = "../rpc", default-features = false, features = ["client"] }
zeron-syntax = { path = "../syntax", default-features = false }
zeron-theme.workspace = true
gpui.workspace = true
gpui_platform.workspace = true

gpui-base.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
alacritty_terminal.workspace = true
base64 = "0.22"
unicode-segmentation.workspace = true
unicode-width.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc = "0.2"
wry = { version = "0.56", default-features = false, features = ["os-webview"] }
raw-window-handle = "0.6"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSBitmapImageRep", "NSImage", "NSEvent", "NSView", "NSWindow"] }
objc2-foundation = "0.3.2"
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKNavigationDelegate", "WKNavigationAction", "WKSnapshotConfiguration"] }
reqwest.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "webp"] }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync"] }
web-sys = { version = "0.3", features = ["Blob", "CssStyleDeclaration", "Document", "Element", "Event", "EventTarget", "File", "FileList", "HtmlElement", "HtmlIFrameElement", "HtmlInputElement", "Location", "Node", "Storage", "Window"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

web-time = "1"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

zeron-rpc = { path = "../rpc", features = ["native"] }
zeron-update.workspace = true
gpui_tokio.workspace = true
tokio.workspace = true
zeron-syntax = { path = "../syntax", features = ["highlighting"] }


zeron-engine.workspace = true
zeron-harness.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
mimalloc.workspace = true
tracing-subscriber.workspace = true
