[package]
name = "zeron-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zeron-proto.workspace = true
similar.workspace = true
zeron-doc.workspace = true
zeron-engine.workspace = true
zeron-harness.workspace = true
zeron-rpc.workspace = true
zeron-update.workspace = true
zeron-syntax.workspace = true
zeron-theme.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
alacritty_terminal.workspace = true
base64 = "0.22"
unicode-segmentation.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["elcapitan", "highsierra", "link"] }
foreign-types = "0.5"
block = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.18"
windows-capture = "1.5.0"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts", "screenshot"] }
atspi = "0.30.0"
png = "0.18"
url = "2"
x11rb = { version = "0.14.0", features = ["image"] }

[dev-dependencies]
tempfile.workspace = true
